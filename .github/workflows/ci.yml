name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_EDITOR_URL: https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
  TEMPLATES_URL: https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
  TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.7.2.stable

jobs:
  # ── 1. 测试 ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot editor
        run: |
          curl -sSL --retry 3 -o godot.zip "$GODOT_EDITOR_URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot-editor
          chmod +x godot-editor
          ./godot-editor --version

      - name: Import project (first pass)
        run: ./godot-editor --headless --path . --import > /dev/null 2>&1 || true

      - name: Validate card/deck data
        run: python3 tools/validate_data.py

      - name: Run test suites
        run: |
          set -e
          for t in test_game_logic_scene test_turn_manager_scene task4_card_display_check task6_board_render_check task7_hand_manager_check test_network_scene test_interactions_scene test_edge_scene; do
            echo "::group::run $t"
            ./godot-editor --headless --path . "res://tests/$t.tscn"
            echo "::endgroup::"
          done

  # ── 2. Windows 构建 ────────────────────────────────────
  windows:
    name: Windows Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download Godot editor + export templates
        run: |
          curl -sSL --retry 3 -o godot.zip "$GODOT_EDITOR_URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot-editor
          chmod +x godot-editor
          mkdir -p "$TEMPLATES_DIR"
          if [ ! -f "$TEMPLATES_DIR/version.txt" ]; then
            curl -sSL --retry 3 -o templates.tpz "$TEMPLATES_URL"
            unzip -q templates.tpz -d templates_x
            cp -r templates_x/templates/* "$TEMPLATES_DIR/"
          fi
          ls "$TEMPLATES_DIR" | head -3

      - name: Import project
        run: ./godot-editor --headless --path . --import > /dev/null 2>&1 || true

      - name: Export Windows release
        run: |
          ./godot-editor --headless --path . --export-release "Windows" build/1914.exe
          test -f build/1914.exe
          test "$(stat -c%s build/1914.exe)" -gt 10000000

      - name: Package 1914-Windows.zip
        run: |
          cd build
          zip -q ../1914-Windows.zip 1914.exe

      - uses: actions/upload-artifact@v4
        with:
          name: 1914-Windows
          path: 1914-Windows.zip
          if-no-files-found: error

  # ── 3. Android 构建 ────────────────────────────────────
  android:
    name: Android Build
    runs-on: ubuntu-latest
    needs: test
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download Godot editor + export templates
        run: |
          curl -sSL --retry 3 -o godot.zip "$GODOT_EDITOR_URL"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot-editor
          chmod +x godot-editor
          mkdir -p "$TEMPLATES_DIR"
          if [ ! -f "$TEMPLATES_DIR/version.txt" ]; then
            curl -sSL --retry 3 -o templates.tpz "$TEMPLATES_URL"
            unzip -q templates.tpz -d templates_x
            cp -r templates_x/templates/* "$TEMPLATES_DIR/"
          fi
          ls "$TEMPLATES_DIR" | head -3

      - name: Prepare debug + release keystores
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          fi
          mkdir -p /tmp/ks
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/ks/release.keystore
            echo "[ci] release keystore decoded from secrets"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets 未配置——使用临时自签名 keystore（仅供测试分发）"
            keytool -genkeypair -v -keystore /tmp/ks/release.keystore \
              -storepass 1914ci -alias 1914ci -keypass 1914ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=1914 CI,O=1914,C=CN" > /dev/null
          fi

      - name: Write Godot editor settings (Android SDK/Java/keystores)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          config_version=5

          [editor]

          export/android/android_sdk_path="/usr/local/lib/android/sdk"
          export/android/java_sdk_path="${JAVA_HOME}"
          export/android/debug_keystore="$HOME/.android/debug.keystore"
          export/android/debug_keystore_user="androiddebugkey"
          export/android/debug_keystore_pass="android"
          EOF

      - name: Install Android gradle build template
        run: ./godot-editor --headless --path . --install-android-build-template

      - name: Inject release keystore into export presets
        run: |
          KS=/tmp/ks/release.keystore
          KU="${KEYSTORE_USER:-1914ci}"
          KP="${KEYSTORE_PASSWORD:-1914ci}"
          if [ -z "$KEYSTORE_B64" ]; then KU=1914ci; KP=1914ci; fi
          sed -i \
            -e "s|keystore/release=.*|keystore/release=\"$KS\"|" \
            -e "s|keystore/release_user=.*|keystore/release_user=\"$KU\"|" \
            -e "s|keystore/release_password=.*|keystore/release_password=\"$KP\"|" \
            export_presets.cfg
          grep -c "keystore/release=" export_presets.cfg

      - name: Import project
        run: ./godot-editor --headless --path . --import > /dev/null 2>&1 || true

      - name: Export Android release APK
        run: |
          ./godot-editor --headless --path . --export-release "Android" build/1914.apk
          test -f build/1914.apk
          test "$(stat -c%s build/1914.apk)" -gt 10000000

      - name: Package 1914-Android.apk
        run: cp build/1914.apk 1914-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 1914-Android
          path: 1914-Android.apk
          if-no-files-found: error

  # ── 4. GitHub Release（仅版本 Tag 触发） ───────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 1914-Windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: 1914-Android
          path: release

      - name: Verify release files
        run: |
          ls -la release/
          test -f release/1914-Windows.zip
          test -f release/1914-Android.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/1914-Windows.zip release/1914-Android.apk \
            --title "1914 $GITHUB_REF_NAME" \
            --generate-notes
